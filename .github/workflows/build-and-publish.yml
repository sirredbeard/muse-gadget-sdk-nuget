name: build-and-publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Lint GitHub Actions
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  build:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore Muse.Gadget.Sdk.slnx

      - name: Build
        run: dotnet build Muse.Gadget.Sdk.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Muse.Gadget.Sdk.slnx --configuration Release --no-build --verbosity minimal

      - name: Pack
        run: dotnet pack src/Muse.Gadget.Sdk.Linux/Muse.Gadget.Sdk.Linux.csproj --configuration Release --no-build --output artifacts

      - name: Upload package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: muse-gadget-sdk-linux-nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

  aot:
    name: aot-${{ matrix.rid }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 11.0.x

      - name: Publish native AOT smoke app
        run: >-
          dotnet publish
          tests/Muse.Gadget.Sdk.Linux.AotSmoke/Muse.Gadget.Sdk.Linux.AotSmoke.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishAot=true
          -p:StripSymbols=true
          --output artifacts/${{ matrix.rid }}

      - name: Run native AOT smoke app
        run: ./artifacts/${{ matrix.rid }}/Muse.Gadget.Sdk.Linux.AotSmoke

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, aot]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 11.0.x

      - name: Download package
        uses: actions/download-artifact@v8.0.1
        with:
          name: muse-gadget-sdk-linux-nupkg
          path: artifacts

      - name: Push package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: 0.1.0
        run: |
          set -euo pipefail
          while read -r package_version_id; do
            [ -n "$package_version_id" ] || continue
            gh api --method DELETE \
              "/users/${{ github.repository_owner }}/packages/nuget/Muse.Gadget.Sdk.Linux/versions/$package_version_id"
          done < <(
            gh api --paginate \
              "/users/${{ github.repository_owner }}/packages/nuget/Muse.Gadget.Sdk.Linux/versions?per_page=100" \
              --jq '.[] | select(.name == env.PACKAGE_VERSION) | .id'
          )
          dotnet nuget push artifacts/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "$GITHUB_TOKEN"

      - name: Replace GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: 0.1.0
        run: |
          set -euo pipefail
          gh release delete "$PACKAGE_VERSION" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$PACKAGE_VERSION" artifacts/*.nupkg \
            --title "Muse Gadget SDK for .NET $PACKAGE_VERSION" \
            --notes "Muse Gadget SDK for .NET $PACKAGE_VERSION."
