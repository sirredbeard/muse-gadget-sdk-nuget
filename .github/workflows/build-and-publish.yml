name: build-and-publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint GitHub Actions
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  build:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore Muse.Gadget.Sdk.slnx

      - name: Build
        run: dotnet build Muse.Gadget.Sdk.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Muse.Gadget.Sdk.slnx --configuration Release --no-build --verbosity minimal

      - name: Pack
        run: dotnet pack src/Muse.Gadget.Sdk.Linux/Muse.Gadget.Sdk.Linux.csproj --configuration Release --no-build --output artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: muse-gadget-sdk-linux-nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

  aot:
    name: aot-${{ matrix.rid }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Publish native AOT smoke app
        run: >-
          dotnet publish
          tests/Muse.Gadget.Sdk.Linux.AotSmoke/Muse.Gadget.Sdk.Linux.AotSmoke.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishAot=true
          -p:StripSymbols=true
          --output artifacts/${{ matrix.rid }}

      - name: Run native AOT smoke app
        run: ./artifacts/${{ matrix.rid }}/Muse.Gadget.Sdk.Linux.AotSmoke

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, aot]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: muse-gadget-sdk-linux-nupkg
          path: artifacts

      - name: Push package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "$GITHUB_TOKEN"
          --skip-duplicate
